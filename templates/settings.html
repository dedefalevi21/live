{% extends "base.html" %}
{% block content %}
<div class="settings-container">
    <h1 class="card-title">Pengaturan</h1>

    <div class="settings-grid">
        <div class="card">
            <h2 class="card-subtitle">Ubah Sandi</h2>
            <form method="POST" action="#" class="settings-form">
                <div class="form-group">
                    <label for="old_password">Sandi Lama</label>
                    <input type="password" id="old_password" name="old_password">
                </div>
                <div class="form-group">
                    <label for="new_password">Sandi Baru</label>
                    <input type="password" id="new_password" name="new_password">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Konfirmasi Sandi Baru</label>
                    <input type="password" id="confirm_password" name="confirm_password">
                </div>
                <button type="submit" class="btn btn-primary">Ubah Sandi</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-subtitle">Zona Waktu</h2>
            <form method="POST" action="#" class="settings-form">
                <div class="form-group">
                    <label for="timezone">Pilih Zona Waktu</label>
                    <select id="timezone" name="timezone" class="form-control">
                        <option value="WIB">WIB - Waktu Indonesia Barat (UTC+7)</option>
                        <option value="WITA">WITA - Waktu Indonesia Tengah (UTC+8)</option>
                        <option value="WIT">WIT - Waktu Indonesia Timur (UTC+9)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Simpan Zona Waktu</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
