<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — yxdesu Stream</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Poppins',system-ui,sans-serif;
            background:radial-gradient(circle at 50% 0%, #1e1b4b, #0f0f1a 60%);
            color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center;
        }
        .login-card{
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:20px; padding:40px 32px; width:100%; max-width:400px;
            box-shadow:0 20px 40px -10px rgba(0,0,0,0.4);
        }
        .login-card h2{
            font-size:24px; font-weight:800; margin-bottom:24px; text-align:center; color:#ec4899;
        }
        .form-field{margin-bottom:18px}
        .form-field label{display:block;font-size:12px;font-weight:600;color:#cbd5e1;margin-bottom:7px;letter-spacing:.4px}
        .form-field input{
            width:100%;font:inherit;font-size:14px;color:#fff;background:rgba(0,0,0,0.35);
            border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;
        }
        .form-field input:focus{outline:none;border-color:#8b5cf6}
        .btn{
            width:100%;font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:11px;
            padding:12px 18px;border:none;transition:.2s;background:linear-gradient(135deg,#ec4899,#8b5cf6);
            color:#fff;box-shadow:0 10px 20px -10px rgba(236,72,153,0.4);
        }
        .btn:hover{filter:brightness(1.1)}
        .error{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13px}
        .footer{margin-top:20px;text-align:center;font-size:12px;color:#cbd5e1}
        .footer a{color:#ec4899;text-decoration:none}
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Masuk ke yxdesu Stream</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for cat, msg in messages %}
                {% if cat == 'error' %}
                <div class="error">{{ msg }}</div>
                {% endif %}
            {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-field">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Masukkan username">
            </div>
            <div class="form-field">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Masukkan password">
            </div>
            <button type="submit" class="btn">Masuk</button>
        </form>
        <div class="footer">
            Jangan punya akun? Hubungi administrator.
        </div>
    </div>
</body>
</html>
