<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yxdesu Stream — Live Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="bar">
            <a class="brand" href="#">
                <span class="mark"><img src="yxdede123.JPG" alt="logo"></span>
                <span><b class="brand-name">yxdesu Stream</b></span>
            </a>
            <nav class="nav-tabs" id="tabs">
                <button class="on" data-page="dash">Dashboard</button>
                <button data-page="create">Buat Live</button>
                <button data-page="files">Berkas</button>
                <button data-page="settings">Pengaturan</button>
            </nav>
            <div class="head-right">
                <span class="clock" id="clock">00:00:00 WIB</span>
                <div class="avatar"><img src="yxdede123.JPG" alt="avatar"></div>
            </div>
        </div>
    </header>
    <main>
        <div class="page-head">
            <h1>Dashboard</h1>
            <p>Kelola semua sesi live streaming dari satu tempat.</p>
        </div>
    </div>
</body>
</html>
